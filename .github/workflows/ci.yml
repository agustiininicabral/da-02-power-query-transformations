name: Power Query Transformations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Python formatting
        run: ruff format --check scripts tests

      - name: Run Ruff lint checks
        run: ruff check scripts tests

      - name: Test dataset and M asset contracts
        run: python -m pytest -q

      - name: Validate committed datasets and M query dependencies
        run: python scripts/validate_project.py
